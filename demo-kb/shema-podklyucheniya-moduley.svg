" height="7" rx="1" fill="#FFF6D6"/></g><text x="886" y="708" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7A7468" text-anchor="middle">+12 В сверху, минус снизу</text><rect x="56" y="286" width="600" height="116" rx="18" fill="#FBF9F4" stroke="#E2DBCC" stroke-width="1"/><text x="80" y="318" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#151515">Правила</text><text x="80" y="344" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4E4A43"><tspan x="80" dy="0">Не больше 20 модулей в цепочке от одной точки питания</tspan><tspan x="80" dy="19.575">Длинная цепочка тускнеет к концу — допитайте с другого конца</tspan><tspan x="80" dy="19.575">Соединения — термоусадка с клеем, не изолента</tspan></text><rect x="56" y="760" width="1094" height="92" rx="18" fill="#151515"/><text x="84" y="796" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Мощность блока = модули × ватты на модуль × 1,2 (запас 20 %)</text><text x="84" y="828" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F0B303">42 модуля × 0,72 Вт = 30,2 Вт × 1,2 = 36,3 Вт → берём блок 60 Вт. Больше 80 % нагрузки блок не держим.</text></svg>
