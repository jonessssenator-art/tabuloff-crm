<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><title>Схема подключения модулей — Табулофф</title><defs><filter id="ledg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="900" fill="#FFFFFF"/><text x="56" y="74" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#151515">Подключение модулей к блоку питания</text><text x="56" y="106" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7A7468">Модули 12 В соединяются параллельно: плюс к плюсу, минус к минусу</text><rect x="56" y="150" width="220" height="74" rx="16" fill="#FBF9F4" stroke="#E2DBCC" stroke-width="1.5"/><text x="76" y="182" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#151515">Сеть 220 В</text><text x="76" y="205" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A7468">щиток клиента</text><line x1="276" y1="180" x2="326" y2="180" stroke="#8B5A2B" stroke-width="4"/><line x1="276" y1="194" x2="326" y2="194" stroke="#2C5BD6" stroke-width="4"/><rect x="326" y="150" width="220" height="74" rx="16" fill="#FBF9F4" stroke="#E2DBCC" stroke-width="1.5"/><text x="346" y="182" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#151515">Автомат 6 А</text><text x="346" y="205" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A7468">отдельная линия</text><line x1="546" y1="180" x2="596" y2="180" stroke="#8B5A2B" stroke-width="4"/><line x1="546" y1="194" x2="596" y2="194" stroke="#2C5BD6" stroke-width="4"/><rect x="596" y="150" width="220" height="74" rx="16" fill="#FBF