 x1="625" y1="740" x2="655" y2="740" stroke="#4E4A43" stroke-width="1.5"/><text x="664" y="470" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#4E4A43" transform="rotate(-90 664 470)" text-anchor="middle" dy="-4">высота буквы 500 мм</text><rect x="556" y="153" width="26" height="26" rx="7" fill="#151515"/><text x="569" y="171" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">1</text><rect x="591" y="287" width="26" height="26" rx="7" fill="#151515"/><text x="604" y="305" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">2</text><rect x="387" y="157" width="26" height="26" rx="7" fill="#151515"/><text x="400" y="175" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">3</text><rect x="287" y="237" width="26" height="26" rx="7" fill="#151515"/><text x="300" y="255" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">4</text><rect x="195" y="457" width="26" height="26" rx="7" fill="#151515"/><text x="208" y="475" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">5</text><rect x="187" y="287" width="26" height="26" rx="7" fill="#151515"/><text x="200" y="305" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">6</text><rect x="177" y="677" width="26" height="26" rx="7" fill="#151515"/><text x="190" y="695" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">7</text><rect x="395" y="759" width="26" height="26" rx="7" fill="#151515"/><text x="408" y="777" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">8</text><rect x="730" y="160" width="420" height="620" rx="22" fill="#FBF9F4" stroke="#E2DBCC" stroke-width="1"/><rect x="755" y="183" width="26" height="26" rx="7" fill="#151515"/><text x="768" y="201" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">1</text><text x="796" y="194" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#151515">Лицо</text><text x="796" y="216" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7A7468">акрил опал 3 мм — рассеивает свет</text><rect x="755" y="255" width="26" height="26" rx="7" fill="#151515"/><text x="768" y="273" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">2</text><text x="796" y="266" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#151515">Плёнка Oracal 8500</text><text x="796" y="288" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7A7468">световая, задаёт цвет лица</text><rect x="755" y="327" width="26" height="26" rx="7" fill="#151515"/><text x="768" y="345" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">3</text><text x="796" y="338" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#151515">Борт</text><text x="796" y="360" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7A7468">ПВХ 3 мм или алюминий, крашеный</text><rect x="755" y="399" width="26" height="26" rx="7" fill="#151515"/><text x="768" y="417" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">4</text><text x="796" y="410" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#151515">Светодиодные модули 12 В</text><text x="796" y="432" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7A7468">на заднике, шаг ≈ глубине буквы</text><rect x="755" y="471" width="26" height="26" rx="7" fill="#151515"/><text x="768" y="489" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">5</text><text x="796" y="482" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#151515">Задник</text><text x="796" y="504" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7A7468">ПВХ 10 мм — на нём модули и крепёж</text><rect x="755" y="543" width="26" height="26" rx="7" fill="#151515"/><text x="768" y="561" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">6</text><text x="796" y="554" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#151515">Шпилька М6 с втулкой</text><text x="796" y="576" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7A7468">зазор до стены 20–40 мм</text><rect x="755" y="615" width="26" height="26" rx="7" fill="#151515"/><text x="768" y="633" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">7</text><text x="796" y="626" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#151515">Провод в гофре</text><text x="796" y="648" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7A7468">через стену к блоку питания</text><rect x="755" y="687" width="26" height="26" rx="7" fill="#151515"/><text x="768" y="705" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#F0B303" text-anchor="middle">8</text><text x="796" y="698" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#151515">Дренажное отверстие</text><text x="796" y="720" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7A7468">внизу борта — уходит конденсат</text><rect x="56" y="822" width="1094" height="50" rx="16" fill="#151515"/><text x="80" y="853" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Глубина меньше 80 мм — на лице видны пятна от модулей. Узкий штрих до 5 см — один ряд модулей по центру.</text></svg>
